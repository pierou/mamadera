AuthorName: Pierre-Vincent Jacquier
AuthorEmail: pvjacquier@users.noreply.github.com
WebSite: https://github.com/pierou/mamadera
SourceCode: https://github.com/pierou/mamadera
IssueTracker: https://github.com/pierou/mamadera/issues
Changelog: https://github.com/pierou/mamadera/releases

AutoName: Mamadera

RepoType: git
Repo: https://github.com/pierou/mamadera

Builds:
  - versionName: 1.2.1
    versionCode: 11
    commit: 5fcd9b1bfed571c530cfc928026f0f9ae8ea2390
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - "flutterVersion=$(sed -n -E \"s/.*flutter-version: '([0-9][0-9.]*)'.*/\\1/p\"\
        \ .github/workflows/ci.yml | head -1)\ngit -C $$flutter$$ checkout -f \"${flutterVersion:-3.44.8}\""
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e '/foojay/d' android/settings.gradle.kts
      - sed -i -e 's/releaseBuildRequested && !hasReleaseSigning/false/' android/app/build.gradle.kts
      - sed -i -e '/Pin the compile toolchain/,/^}/d' android/app/build.gradle.kts
      - sed -i -e '/kotlin.jvm.toolchain/d' -e '/java.installations.auto-download/d'
        android/gradle.properties
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.2.1
CurrentVersionCode: 11
