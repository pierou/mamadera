Repo: https://github.com/pierou/mamadera

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - "flutterVersion=$(sed -n -E \"s/.*flutter-version: '([0-9][0-9.]*)'.*/\\1/p\"\
        \ .github/workflows/ci.yml | head -1)\ngit -C $$flutter$$ checkout -f \"${flutterVersion:-3.44.1}\""
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e '/foojay/d' android/settings.gradle.kts
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

