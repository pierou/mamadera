# F-Droid metadata for Mamadera (com.pvjio.mamadera)
#
# Where this file goes: it is submitted to a fork of
#   https://gitlab.com/fdroid/fdroiddata  (moved from GitHub to GitLab; the old
#   github.com/fdroid/fdroiddata link in the previous version of this file was
#   dead), as a merge request labelled "New App". The fdroiddata pipeline then
#   builds every Builds entry below from the tagged source, runs the scanner,
#   and signs the APK with the F-Droid key.
#
# Localized prose and screenshots are NOT in this file. F-Droid 2.0 fetches
# them from this repo (the app's own source), fastlane-style:
#   metadata/{en-US,fr,es}/short_description.txt
#   metadata/{en-US,fr,es}/full_description.txt
#   metadata/{en-US,fr,es}/changelogs/<versionCode>.txt
#   metadata/en-US/images/icon.png, phoneScreenshots/
# Keep that tree in sync with the store copy (store/source/, fields/) on every
# release — see docs/fdroiddata/README.md.
#
# Build strategy (per fdroiddata templates/build-flutter.yml):
#   - Flutter comes in as the srclib 'flutter' (git clone of flutter/flutter at
#     the 'stable' branch); the prebuild step force-checks out the exact
#     version pinned in .github/workflows/ci.yml for the tagged commit.
#     fdroidserver replaces $$flutter$$ with the srclib's absolute path.
#   - Builds from v1.1.0 on carry a patch that disables the release-signing
#     fail-fast guard in android/app/build.gradle.kts. The guard exists to keep
#     the upstream keystore out of CI environments; F-Droid never has it and
#     re-signs everything itself, so the guard would only abort the build.
#     v1.0.0/v1.0.1 predate the guard (they fall back to debug signing, which
#     is harmless here) and need no patch.
#   - No ABI split: F-Droid serves the universal APK.
#
# Version codes are the monotonic +N from pubspec.yaml (RC tags consumed
# intermediate codes on purpose — see docs/AUDIT-2026-10-21.md). Do not renumber.

Categories:
  - Health Manager
License: MIT
AuthorName: Pierre-Vincent Jacquier
AuthorEmail: pvjacquier@users.noreply.github.com
WebSite: https://github.com/pierou/mamadera
SourceCode: https://github.com/pierou/mamadera
IssueTracker:
  https://github.com/pierou/mamadera/issues
Changelog:
  https://github.com/pierou/mamadera/releases

RepoType: git
Repo: https://github.com/pierou/mamadera

# Auto-update: stable tags are vMAJOR.MINOR.PATCH (the ^ pattern excludes the
# v*-rc.N tags, whose higher +N codes would otherwise be read as releases).
# The version lives in pubspec.yaml — Flutter's gradle files only reference
# flutter.versionCode/Name, so the Tags mode default (gradle scan) would find
# nothing; the pipe-format UpdateCheckData below overrides it with the pubspec.
AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.2.1
CurrentVersionCode: 11

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    rm:
      - ios
    srclibs:
      - flutter@stable
    prebuild:
      - |
        flutterVersion=$(sed -n -E "s/.*flutter-version: '([0-9][0-9.]*)'.*/\1/p" .github/workflows/ci.yml | head -1)
        git -C $$flutter$$ checkout -f "${flutterVersion:-3.44.1}"
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      - build/srclib/flutter/bin/cache
    scandelete:
      - build/srclib/flutter
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
    output: build/app/outputs/flutter-apk/app-release.apk

