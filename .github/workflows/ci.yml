name: CI & Secure Build

# Permissions par défaut : lecture seule
permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    # Daily smoke run on `main` (schedule only fires on the default
    # branch) — keeps a real-Android signal flowing without holding PRs.
    - cron: '0 4 * * *'
  workflow_dispatch: {}

jobs:
  # 1. 🔍 Audit dépendances & secrets
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # gitleaks scans a commit range (base^..head) derived from the event;
          # the default shallow clone cannot resolve the base commit.
          fetch-depth: 0

      - name: Trivy (vuln dépendances)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          # Skip Dart/Flutter lockfile — Trivy has poor support for pubspec.lock
          # and produces false positives. Use `dart pub outdated` + manual review instead.
          skip-dirs: '${{ github.workspace }}/.pub-cache'
        continue-on-error: true  # Non-blocking until we migrate to a Dart-aware scanner

      - name: Semgrep (SAST basique)
        uses: semgrep/semgrep-action@v1
        with:
          config: 'auto'
        continue-on-error: true

      - name: Gitleaks (secrets in git history)
        # Blocking: any new secret in history fails the pipeline.
        # Known test fixtures carry inline `// gitleaks:allow` annotations.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. 🧪 Lint & Tests
  lint-test:
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check version sync (AppConfig vs pubspec)
        run: |
          PUB_VERSION=$(awk '/^version:/{print $2; exit}' pubspec.yaml | cut -d'+' -f1)
          APP_VERSION=$(sed -n "s/.*version = '\([^']*\)';.*/\1/p" lib/core/config/app_config.dart | head -1)
          if [ "$PUB_VERSION" != "$APP_VERSION" ]; then
            echo "❌ Version mismatch: AppConfig.version='$APP_VERSION' but pubspec.yaml version='$PUB_VERSION'"
            echo "   Bump AppConfig.version in lib/core/config/app_config.dart to match pubspec.yaml."
            exit 1
          fi
          echo "✅ Version in sync: $PUB_VERSION"

      - name: Analyze (strict)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: |
          flutter test \
            test/data/ \
            test/presentation/ \
            test/core \
            test/features \
            test/shared \
          --coverage

      - name: Install lcov tools
        run: sudo apt-get install -y lcov

      - name: Check Coverage Threshold
        run: |
          MIN_COVERAGE=80

          # Clean coverage report (exclude generated/test files)
          lcov --ignore-errors unused,empty --remove coverage/lcov.info \
            'lib/generated/*' \
            '*_freezed.dart' \
            '*.g.dart' \
            'test/*' \
            '/tmp/*' \
            'lib/l10n/*' \
            -o coverage/lcov.info.cleaned 2>/dev/null || true

          # Extract actual line coverage from lcov --summary stdout
          ACTUAL=$(lcov --ignore-errors empty --summary coverage/lcov.info.cleaned 2>&1 | grep "lines" | awk '{print $2}' | cut -d'.' -f1)

          if [ "$ACTUAL" -ge $MIN_COVERAGE ]; then
            echo "✅ Coverage OK: ${ACTUAL}% (minimum: ${MIN_COVERAGE}%)"
          else
            echo "❌ Coverage failure!"
            echo "   Actual coverage:  ${ACTUAL}%"
            echo "   Required minimum: ${MIN_COVERAGE}%"
            echo ""
            echo "To fix this, add tests for untested code or run locally with:"
            echo "  make check-coverage"
            exit 1
          fi

  # 3. 🤖 Build Android (Reproductible & Signé)
  # 3. 🤖 Build Android (tags only — requires the release keystore)
  build-android:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Build APK (F-Droid / sideload)
        run: |
          flutter pub get
          flutter build apk --release --split-debug-info=build/
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build AAB (Google Play)
        run: |
          flutter build appbundle --release --split-debug-info=build/
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  # 4. 🍎 Build iOS (MacOS)
  build-ios:
    runs-on: macos-14
    needs: lint-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build IPA
        run: |
          flutter build ios --release --no-codesign --split-debug-info=build/

        # flutter build ios appelle automatiquement pod install si nécessaire

      - name: Archive Runner.app
        run: |
          cd build/ios/iphoneos
          zip -r ../../../../ios-Runner-app.zip Runner.app

      - name: Upload iOS artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: ios-Runner-app.zip

  # 5. 📱 Integration tests on Android emulator
  #
  # Runner reality (public repo): PR/push events land on 2-vCPU shared
  # runners WITHOUT KVM, so the emulator runs software-emulated (`-accel
  # off`). Two constraints shape this job:
  #   - `flutter test` on a device launches the app once PER FILE (stop →
  #     install → start → wait for VM service), so the six flow files mean
  #     six ~9-minute launch cycles — never fits in one CI window.
  #     `ci_smoke_suite.dart` bundles the core flows (onboarding, navigation,
  #     baby profile — 10 tests) into ONE launch. The full six-file suite
  #     stays available locally / on KVM runners.
  #   - Known flake (run 33142073657): the headless SwiftShader window
  #     sometimes reports `bad window surface handle` and the Dart engine
  #     then waits for a surface callback that never arrives — no VM service
  #     line is ever emitted and the tool waits SILENTLY forever (its
  #     ProtocolDiscovery has no timeout). A live logcat watchdog detects
  #     this: if the VM service line is absent 25 min after the phase
  #     starts, the test process is killed and the step fails fast with a
  #     full logcat artifact, so the retry leg below gets a fresh boot.
  # On failure the logcat is dumped INSIDE the action script, because the
  # action kills the emulator as soon as the script exits (a post-step
  # would talk to a dead device).
  #
  # Blocking policy (runs 33142073657 + 33147275021 + 33211194939):
  # public-repo 2-core no-KVM runners are deterministically slow - even
  # on a good boot (VM service up, verified in run 33211194939) the
  # 10-test smoke suite needs ~55 min of phase time, so running it on
  # every PR just paints a reliable red cross that cannot gate anything
  # useful. It therefore does NOT run on pull_request; it feeds the
  # daily cron and manual dispatches as an informational signal, and
  # genuinely GATES the release on v* tags (a rare, deliberate event
  # where the wait is acceptable). Ordinary pushes to main/develop skip
  # it to save free-tier minutes. PR-level integration feedback belongs
  # on the self-hosted runner, which runs the same suite in ~3 min.
  # Full suite locally:
  #   flutter test integration_test -d <device>
  integration-tests:
    runs-on: ubuntu-latest
    needs: lint-test
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          # NOTE: android-emulator-runner splits `script` into one `sh -c`
          # per non-comment line — backslash line-continuations are NOT
          # supported. Each command must be a single self-contained line.
          # Line 1 = smoke suite in ONE app launch, with a background
          # live-logcat + a 25-min watchdog: if "Dart VM service is
          # listening" never appears (surface flake → engine never boots),
          # kill the test process instead of burning the 60-min bound.
          # Line 2 = driver test (separate entrypoint, own build/install).
          script: |
            /usr/local/lib/android/sdk/platform-tools/adb -s emulator-5554 logcat -v time -T 1 > live_logcat.txt 2>/dev/null & LG=$!; timeout -k 60 3600 flutter test integration_test/ci_smoke_suite.dart & T=$!; ( sleep 1500; grep -q "Dart VM service is listening" live_logcat.txt || kill -TERM $T 2>/dev/null ) & W=$!; wait $T; S=$?; kill $W $LG 2>/dev/null; if [ $S -ne 0 ]; then echo "flutter test failed (exit $S) — VM service may never have come up (surface flake)"; timeout 60 /usr/local/lib/android/sdk/platform-tools/adb -s emulator-5554 logcat -d -v time > emulator_logcat.txt; exit 1; fi
            timeout -k 60 1800 flutter drive --driver=integration_test/driver_integration_test.dart --target=lib/driver_main.dart || { timeout 60 /usr/local/lib/android/sdk/platform-tools/adb -s emulator-5554 logcat -d -v time > emulator_logcat.txt; exit 1; }

      - name: Upload emulator logcat (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: emulator_logcat.txt
          if-no-files-found: ignore

  # 5b. 📱 One retry on a FRESH emulator boot. The surface flake is a
  #      per-boot race, so re-rolling can genuinely fix it (unlike the
  #      missing-KVM condition, which is permanent for public-repo
  #      runners). `always()` is REQUIRED: without a status function in
  #      `if`, a failed need auto-skips the dependent job before the
  #      expression is honoured.
  integration-tests-retry:
    runs-on: ubuntu-latest
    needs: integration-tests
    if: ${{ always() && needs.integration-tests.result == 'failure' }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run integration tests on Android emulator (retry, fresh boot)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            /usr/local/lib/android/sdk/platform-tools/adb -s emulator-5554 logcat -v time -T 1 > live_logcat.txt 2>/dev/null & LG=$!; timeout -k 60 3600 flutter test integration_test/ci_smoke_suite.dart & T=$!; ( sleep 1500; grep -q "Dart VM service is listening" live_logcat.txt || kill -TERM $T 2>/dev/null ) & W=$!; wait $T; S=$?; kill $W $LG 2>/dev/null; if [ $S -ne 0 ]; then echo "flutter test failed (exit $S) — VM service may never have come up (surface flake)"; timeout 60 /usr/local/lib/android/sdk/platform-tools/adb -s emulator-5554 logcat -d -v time > emulator_logcat.txt; exit 1; fi
            timeout -k 60 1800 flutter drive --driver=integration_test/driver_integration_test.dart --target=lib/driver_main.dart || { timeout 60 /usr/local/lib/android/sdk/platform-tools/adb -s emulator-5554 logcat -d -v time > emulator_logcat.txt; exit 1; }

      - name: Upload emulator logcat (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat-retry
          path: emulator_logcat.txt
          if-no-files-found: ignore

  # 6. 📦 Release GitHub (sur tag v*)
  release:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios, integration-tests, integration-tests-retry]
    # Runs only on v* tags; the implicit needs rule already skips the job
    # if any leg fails (no status function in `if` = default behaviour).
    # When the first leg passes, the retry leg is skipped — that satisfies
    # the implicit rule (succeeded or skipped).
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repo (needed for --generate-notes)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Verify downloaded artifacts
        run: |
          echo "=== Release directory listing ==="
          ls -laR android-release-apk/ || true
          ls -laR android-release-aab/ || true
          ls -laR ios-release/ || true

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          FILES=()
          for f in \
            "android-release-apk/app-release.apk" \
            "android-release-aab/app-release.aab"; do
            if [ ! -f "$f" ]; then
              echo "WARNING: $f not found, skipping"
            else
              FILES+=("$f")
            fi
          done

          # iOS artifact is optional — only attach if it exists
          if [ -f "ios-release/ios-Runner-app.zip" ]; then
            FILES+=("ios-release/ios-Runner-app.zip")
          else
            echo "WARNING: ios-release/ios-Runner-app.zip not found, skipping"
          fi

          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            "${FILES[@]}"