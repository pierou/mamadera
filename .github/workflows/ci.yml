name: CI & Secure Build

# Permissions par défaut : lecture seule
permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. 🔍 Audit dépendances & secrets
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # gitleaks scans a commit range (base^..head) derived from the event;
          # the default shallow clone cannot resolve the base commit.
          fetch-depth: 0

      - name: Trivy (vuln dépendances)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          # Skip Dart/Flutter lockfile — Trivy has poor support for pubspec.lock
          # and produces false positives. Use `dart pub outdated` + manual review instead.
          skip-dirs: '${{ github.workspace }}/.pub-cache'
        continue-on-error: true  # Non-blocking until we migrate to a Dart-aware scanner

      - name: Semgrep (SAST basique)
        uses: semgrep/semgrep-action@v1
        with:
          config: 'auto'
        continue-on-error: true

      - name: Gitleaks (secrets in git history)
        # Blocking: any new secret in history fails the pipeline.
        # Known test fixtures carry inline `// gitleaks:allow` annotations.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. 🧪 Lint & Tests
  lint-test:
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check version sync (AppConfig vs pubspec)
        run: |
          PUB_VERSION=$(awk '/^version:/{print $2; exit}' pubspec.yaml | cut -d'+' -f1)
          APP_VERSION=$(sed -n "s/.*version = '\([^']*\)';.*/\1/p" lib/core/config/app_config.dart | head -1)
          if [ "$PUB_VERSION" != "$APP_VERSION" ]; then
            echo "❌ Version mismatch: AppConfig.version='$APP_VERSION' but pubspec.yaml version='$PUB_VERSION'"
            echo "   Bump AppConfig.version in lib/core/config/app_config.dart to match pubspec.yaml."
            exit 1
          fi
          echo "✅ Version in sync: $PUB_VERSION"

      - name: Analyze (strict)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: |
          flutter test \
            test/data/ \
            test/presentation/ \
            test/core \
            test/features \
            test/shared \
          --coverage

      - name: Install lcov tools
        run: sudo apt-get install -y lcov

      - name: Check Coverage Threshold
        run: |
          MIN_COVERAGE=80

          # Clean coverage report (exclude generated/test files)
          lcov --ignore-errors unused,empty --remove coverage/lcov.info \
            'lib/generated/*' \
            '*_freezed.dart' \
            '*.g.dart' \
            'test/*' \
            '/tmp/*' \
            'lib/l10n/*' \
            -o coverage/lcov.info.cleaned 2>/dev/null || true

          # Extract actual line coverage from lcov --summary stdout
          ACTUAL=$(lcov --ignore-errors empty --summary coverage/lcov.info.cleaned 2>&1 | grep "lines" | awk '{print $2}' | cut -d'.' -f1)

          if [ "$ACTUAL" -ge $MIN_COVERAGE ]; then
            echo "✅ Coverage OK: ${ACTUAL}% (minimum: ${MIN_COVERAGE}%)"
          else
            echo "❌ Coverage failure!"
            echo "   Actual coverage:  ${ACTUAL}%"
            echo "   Required minimum: ${MIN_COVERAGE}%"
            echo ""
            echo "To fix this, add tests for untested code or run locally with:"
            echo "  make check-coverage"
            exit 1
          fi

  # 3. 🤖 Build Android (Reproductible & Signé)
  # 3. 🤖 Build Android (tags only — requires the release keystore)
  build-android:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Build APK (F-Droid / sideload)
        run: |
          flutter pub get
          flutter build apk --release --split-debug-info=build/
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build AAB (Google Play)
        run: |
          flutter build appbundle --release --split-debug-info=build/
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  # 4. 🍎 Build iOS (MacOS)
  build-ios:
    runs-on: macos-14
    needs: lint-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build IPA
        run: |
          flutter build ios --release --no-codesign --split-debug-info=build/

        # flutter build ios appelle automatiquement pod install si nécessaire

      - name: Archive Runner.app
        run: |
          cd build/ios/iphoneos
          zip -r ../../../../ios-Runner-app.zip Runner.app

      - name: Upload iOS artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: ios-Runner-app.zip

  # 5. 🧪 Integration tests (Android emulator)
  integration-tests:
    runs-on: ubuntu-latest
    needs: lint-test
    # Bounded: on a runner without KVM the emulator is software-emulated and
    # app launch can stall; fail with diagnostics instead of hanging for hours.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          # NOTE: android-emulator-runner splits `script` into one `sh -c`
          # per non-comment line — backslash line-continuations are NOT
          # supported. Each command must be a single self-contained line.
          # `timeout` bounds each phase (25 min for the six harness files,
          # 15 min for flutter drive) so a stalled emulator fails the job
          # instead of hanging; the post-step then captures logcat.
          script: |
            timeout -k 60 1500 flutter test integration_test/baby_profile_flow_test.dart integration_test/feeding_tracking_flow_test.dart integration_test/history_flow_test.dart integration_test/navigation_flow_test.dart integration_test/onboarding_flow_test.dart integration_test/rendering_validation_test.dart
            timeout -k 60 900 flutter drive --driver=integration_test/driver_integration_test.dart --target=lib/driver_main.dart

      - name: Capture emulator diagnostics (on failure)
        if: failure()
        run: |
          ADB=/usr/local/lib/android/sdk/platform-tools/adb
          $ADB -s emulator-5554 logcat -d -v time > emulator_logcat.txt || true
          $ADB -s emulator-5554 shell dumpsys activity top > activity_dump.txt || true
          $ADB -s emulator-5554 shell ps -A > process_list.txt || true
          $ADB devices || true

      - name: Upload emulator diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics
          path: |
            emulator_logcat.txt
            activity_dump.txt
            process_list.txt
          if-no-files-found: ignore

  # 6. 📦 Release GitHub (sur tag v*)
  release:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios, integration-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repo (needed for --generate-notes)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Verify downloaded artifacts
        run: |
          echo "=== Release directory listing ==="
          ls -laR android-release-apk/ || true
          ls -laR android-release-aab/ || true
          ls -laR ios-release/ || true

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          FILES=()
          for f in \
            "android-release-apk/app-release.apk" \
            "android-release-aab/app-release.aab"; do
            if [ ! -f "$f" ]; then
              echo "WARNING: $f not found, skipping"
            else
              FILES+=("$f")
            fi
          done

          # iOS artifact is optional — only attach if it exists
          if [ -f "ios-release/ios-Runner-app.zip" ]; then
            FILES+=("ios-release/ios-Runner-app.zip")
          else
            echo "WARNING: ios-release/ios-Runner-app.zip not found, skipping"
          fi

          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            "${FILES[@]}"