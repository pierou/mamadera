name: CI & Secure Build

# Permissions par défaut : lecture seule
permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. 🔍 Audit dépendances & secrets
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Trivy (vuln dépendances)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          # Skip Dart/Flutter lockfile — Trivy has poor support for pubspec.lock
          # and produces false positives. Use `dart pub outdated` + manual review instead.
          skip-dirs: '${{ github.workspace }}/.pub-cache'
        continue-on-error: true  # Non-blocking until we migrate to a Dart-aware scanner

      - name: Semgrep (SAST basique)
        uses: semgrep/semgrep-action@v1
        with:
          config: 'auto'
        continue-on-error: true

  # 2. 🧪 Lint & Tests
  lint-test:
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (strict)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: |
          flutter test \
            test/data/ \
            test/presentation/ \
            test/core \
            test/features \
            test/shared \
          --coverage

      - name: Install lcov tools
        run: sudo apt-get install -y lcov

      - name: Check Coverage Threshold
        run: |
          MIN_COVERAGE=80

          # Clean coverage report (exclude generated/test files)
          lcov --ignore-errors unused --remove coverage/lcov.info \
            'lib/generated/*' \
            '*_freezed.dart' \
            '*.g.dart' \
            'test/*' \
            '/tmp/*' \
            -o coverage/lcov.info.cleaned 2>/dev/null || true

          # Extract actual line coverage from lcov --summary stdout
          ACTUAL=$(lcov --summary coverage/lcov.info.cleaned 2>&1 | grep "lines" | awk '{print $2}' | cut -d'.' -f1)

          if [ "$ACTUAL" -ge $MIN_COVERAGE ]; then
            echo "✅ Coverage OK: ${ACTUAL}% (minimum: ${MIN_COVERAGE}%)"
          else
            echo "❌ Coverage failure!"
            echo "   Actual coverage:  ${ACTUAL}%"
            echo "   Required minimum: ${MIN_COVERAGE}%"
            echo ""
            echo "To fix this, add tests for untested code or run locally with:"
            echo "  make check-coverage"
            exit 1
          fi

  # 3. 🤖 Build Android (Reproductible & Signé)
  build-android:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode Keystore
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --split-debug-info=build/
        env:
          KEYSTORE_PATH: android/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: build/app/outputs/flutter-apk/app-release.apk

  # 4. 🍎 Build iOS (MacOS)
  build-ios:
    runs-on: macos-14
    needs: lint-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build IPA
        run: |
          flutter build ios --release --no-codesign --split-debug-info=build/

        # flutter build ios appelle automatiquement pod install si nécessaire

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: build/ios/iphoneos/Runner.app

  # 5. 📦 Release GitHub (sur tag v*)
  release:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            android-release/app-release.apk \
            ios-release/Runner.app